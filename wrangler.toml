# PDL Analytics — Cloudflare Worker config
#
# Reference only when deploying via the Cloudflare dashboard (no wrangler
# CLI login available) — the dashboard's own D1 binding + environment
# variable + secret UI is the actual source of truth for a dashboard-based
# deploy. Keep this file in sync afterward so a future `wrangler` deploy
# matches what's live.
#
#   - database_id below is a placeholder until the D1 database is created;
#     update it with the real id once that's done.
#   - ALLOWED_ORIGINS is set to the real site origin (parkerdata.link).
#   - ADMIN_TOKEN must be set as a Worker SECRET (not a plain var) — never
#     commit the real token value to this file or to git.

name = "pdl-analytics"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "pdl-analytics"
database_id = "REPLACE_ME"

[vars]
ALLOWED_ORIGINS = "https://parkerdata.link,https://www.parkerdata.link"

# ADMIN_TOKEN is intentionally NOT set here — set it as a secret via
# `wrangler secret put ADMIN_TOKEN` or the dashboard's "Secrets" UI instead.
