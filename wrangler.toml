# PDL Analytics — Cloudflare Worker config (scaffold)
#
# This is NOT ready to deploy as-is:
#   - database_id below is a placeholder. Run `wrangler d1 create pdl-analytics`
#     and paste the real id in before `wrangler deploy` will work.
#   - ALLOWED_ORIGINS below is a placeholder. Set it to the real site origins
#     you want allowed to send events before going live.
#   - /api/summary in worker.js still needs real authentication — see README.md.

name = "pdl-analytics"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "pdl-analytics"
database_id = "REPLACE_ME"

[vars]
ALLOWED_ORIGINS = "https://parkerdata.link,https://www.parkerdata.link"
